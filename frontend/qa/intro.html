<!doctype html><html><head><meta charset="utf-8"><title>Intro cinematic QA</title>
<style>
body{margin:0;background:#000;color:#e8ecff;font:12px/1.35 system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#ui{position:fixed;left:10px;bottom:10px;z-index:2;right:10px;display:flex;gap:8px;align-items:center;background:#0b1020b0;border:1px solid #2a3570;border-radius:8px;padding:6px 10px}
#ui button{background:#1b2347cc;color:#e8ecff;border:1px solid #3b4a8a;border-radius:6px;padding:3px 8px;font:12px system-ui;cursor:pointer}
#ui button.on{background:#ff5a7a;border-color:#ff9db1}
#scrub{flex:1}
#info{position:fixed;z-index:2;right:10px;top:10px;background:#0b1020b0;border:1px solid #2a3570;border-radius:8px;padding:6px 10px;font:12px ui-monospace,monospace;white-space:pre;min-width:220px}
#card{position:fixed;left:30%;width:40%;top:15%;height:20%;border:2px dashed rgba(255,255,255,.55);background:rgba(255,255,255,.08);border-radius:14px;opacity:0;transition:opacity .6s;pointer-events:none;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font:600 14px system-ui;letter-spacing:.2em}
  .bar{position:fixed;left:0;right:0;height:9vh;background:#000;pointer-events:none}
body.clean #ui,body.clean #info{display:none}
</style></head>
<body>
<div class="bar" style="top:0"></div><div class="bar" style="bottom:0"></div>
<div id="card">TITLE CARD</div>
<div id="ui">
  <button id="play">Pause (P)</button><button id="restart">Restart (R)</button>
  <input id="scrub" type="range" min="0" max="12.5" step="0.01" value="0">
  <span id="tlabel">0.00</span>
  <button data-h="0.5">h 0.5</button><button data-h="1" class="on">h 1.0</button><button data-h="2">h 2.0</button>
  <button data-tier="low">low</button><button data-tier="medium">medium</button><button data-tier="high" class="on">high</button>
  <span style="color:#aab4e8">keys 1-7: t = 1, 3, 4.5, 6.5, 8, 9.5, end</span>
</div>
<div id="info">loading…</div>
<script type="module" src="./intro.ts"></script>
</body></html>
