<!doctype html><html><head><meta charset="utf-8"><title>Trainer QA</title>
<style>
body{margin:0;background:#050814;color:#e8ecff;font:12px/1.35 system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#ui{position:fixed;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;max-width:420px}
#ui .row{display:flex;flex-wrap:wrap;gap:4px}
#ui button{background:#1b2347cc;color:#e8ecff;border:1px solid #3b4a8a;border-radius:6px;padding:4px 8px;font:12px system-ui;cursor:pointer}
#ui button.on{background:#3ee6ff33;border-color:#3ee6ff}
#info{position:fixed;right:10px;top:10px;background:#0b1020b0;border:1px solid #2a3570;border-radius:8px;padding:6px 10px;font:12px ui-monospace,monospace;white-space:pre;min-width:230px}
#strip{position:fixed;inset:0;background:#050814;display:none;align-items:center;justify-content:center}
#strip img{max-width:100%;max-height:100%}
body.clean #ui,body.clean #info{display:none}
</style></head>
<body>
<div id="ui">
  <div class="row"><button data-n="1">1 trainer [1]</button><button data-n="5">5 [5]</button><button data-n="20">20 [2]</button></div>
  <div class="row"><button data-act="wave">Wave [Q]</button><button data-act="cheer">Cheer [E]</button><button data-act="waveall">Everyone wave</button><button data-act="reduced" data-toggle>Reduced motion</button><button data-act="fade" data-toggle>Fade player</button></div>
  <div class="row"><button data-cam="side">Side</button><button data-cam="front">Front</button><button data-cam="threeq">3/4</button><button data-cam="face">Face</button><button data-cam="feet">Feet</button><button data-cam="group">Group</button><button data-cam="free">Free orbit</button></div>
  <div class="row"><button data-act="course">Ground course [C]</button></div>
  <div style="color:#aab4e8">WASD walk (world axes), Shift jog. The cyan-ring trainer is yours; the others walk in circles. The course along +z: paving, stage (deck + rim), curb step, ramp. Sole readout: gap between each foot's lowest sole vertex and the ground under it.</div>
</div>
<div id="info">loading...</div>
<div id="strip"><img id="stripImg" alt=""></div>
<script type="module" src="./trainer.ts"></script>
</body></html>
